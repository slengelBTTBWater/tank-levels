# Every 15 minutes: pull the latest tank levels from Zonelog, save them in
# tank-data.js, and publish the page to GitHub Pages.
name: Update tank levels

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-tanks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch readings from Zonelog
        id: fetch
        continue-on-error: true
        run: node scripts/update-tanks.mjs
        env:
          ZONELOG_CLIENT_ID: ${{ secrets.ZONELOG_CLIENT_ID }}
          ZONELOG_CLIENT_SECRET: ${{ secrets.ZONELOG_CLIENT_SECRET }}
          ZONELOG_COMPANY_GUID: ${{ secrets.ZONELOG_COMPANY_GUID }}

      # Keeps a history of readings, and lets the next run fall back to the
      # last good value if Zonelog doesn't answer.
      - name: Save readings
        run: |
          if git diff --quiet -- tank-data.js; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update tank levels" -- tank-data.js
          git push

      - name: Collect public files
        run: mkdir _site && cp index.html tank-data.js _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deploy

      - name: Report a failed fetch
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Could not fetch one or more tank readings. See the 'Fetch readings from Zonelog' step."
          exit 1
